; ============================================================
; NarRTOS-Drive — PlatformIO yapılandırması
; Hedef: ESP32-S3 + 8MB Flash, EKRANSIZ araç takip cihazı
;
; Wear ile aynı depoda ama AYRI PROJE: kendi platformio.ini'si, kendi
; partisyon tablosu, kendi sürüm numarası. Kökten `pio run` Wear'ı derler,
; buradan `pio run` Drive'ı. Birbirlerinin derlemesini etkilemezler.
;
;   cd drive && pio run -e esp32s3_drive
; ============================================================

[env:esp32s3_drive]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = espidf

; --- Flash & PSRAM ---
; Wear'da opi PSRAM var (ekran buffer'ı için şart). Drive'da ekran yok;
; PSRAM'i şimdilik kapalı tutuyoruz — store&forward tamponu flash'ta duracak.
; Donanım netleşince gerekirse açılır.
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.flash_freq = 80m

board_build.partitions = partitions_drive.csv

; --- Upload ---
; Wear'da 921600 kullanılıyor ama bazı USB-seri köprüler kararsız
; (bkz. Sorun Giderme). Drive'da baştan güvenli değerle başlıyoruz.
upload_protocol = esptool
upload_speed    = 460800
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize

build_flags =
    ; --- Ürün kimliği ---
    ; Aynı depoda iki firmware var; log ve OTA manifest'i ayırt edebilsin.
    -DNARRTOS_PRODUCT=\"drive\"

    ; --- Görev çekirdek/öncelik dağılımı ---
    ; CAN yakalama kaçırılmamalı: kendi çekirdeğinde ve en yüksek öncelikte.
    ; Ağ işleri (MQTT publish, modem AT) diğer çekirdekte; bloklasa da
    ; CAN akışını durdurmaz.
    -DCAN_TASK_CORE=1
    -DCAN_TASK_PRIORITY=6
    -DNET_TASK_CORE=0
    -DNET_TASK_PRIORITY=4
    -DTELEMETRY_TASK_CORE=0
    -DTELEMETRY_TASK_PRIORITY=3

    ; --- Özellik bayrakları ---
    ; Servisi yazılmamış bir bayrağı açan derlemede #error ile durur; kimse
    ; sessizce çalışmayan firmware almasın.
    ;
    ; CAN=0:  transceiver yok, servis `can inject` ile besleniyor (M2).
    ; GNSS=0: alıcı modülü yok, servis `gnss inject` ile besleniyor (M5).
    ;   İkisi de aynı kalıp: servis donanımdan bağımsız, yalnız UART/TWAI
    ;   sürücüsü bayrağın altında.
    ; WIFI/MQTT=1: M3'ün teslimi. Ayar girilmemişse ağ yığını hiç ayağa
    ;   kalkmıyor (tembel kurulum) — ayarsız cihaz güvenle bu bayraklarla
    ;   açılabilir, `net status` neden bağlanmadığını söyler.
    ; MODEM=0: sahadaki gerçek yol ama donanım yok (M7).
    -DENABLE_CAN=0
    -DENABLE_GNSS=0
    -DENABLE_WIFI=1
    -DENABLE_MODEM=0
    ; IMU=0: ICM-42688-P elde yok (M8). Ölü hesap jiroskopsuz da çalışıyor,
    ;   yalnız belirsizliği daha hızlı büyüyor.
    -DENABLE_IMU=0
    -DENABLE_MQTT=1

; ============================================================
; ÖDÜNÇ DONANIM — test ortamı
;
; Drive'ın kendi kartı henüz yok. Elimizdeki ESP32-S3-Touch-LCD-1.28
; (Wear'ın esp32s3_lcd128 kartı) üzerinde komut arayüzünü ve can_service'i
; sınamak için. Ekrana dokunulmuyor; kart yalnızca bir ESP32-S3 olarak
; kullanılıyor.
;
; İki fark zorunlu:
;   flash_size 16MB — kartın gerçek flash'ı (partisyon tablosu ilk 8 MB'ı
;                     kullanır, gerisi boş kalır)
;   flash_mode dio  — Wear'ın sdkconfig.esp32s3_lcd128'i DIO çözüyor.
;                     QIO ile yazarsak bootloader açılmaz.
;
;   pio run -e esp32s3_drive_lcd128 -t upload
; ============================================================
[env:esp32s3_drive_lcd128]
extends = env:esp32s3_drive
board_build.flash_size = 16MB
board_build.flash_mode = dio
