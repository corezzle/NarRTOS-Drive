<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system,'Segoe UI',Roboto,sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93AEC7"/></marker><marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00CAD7"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF6E6E"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F5A623"/></marker></defs>
<rect width="1200" height="560" fill="#040B1C"/>
<text x="190" y="52" text-anchor="middle" fill="#00CAD7" font-size="16" font-weight="800">VEHICLE ENVIRONMENT</text>
<text x="600" y="52" text-anchor="middle" fill="#00CAD7" font-size="16" font-weight="800">NARRTOS-DRIVE (DEVICE)</text>
<text x="1035" y="52" text-anchor="middle" fill="#00CAD7" font-size="16" font-weight="800">SERVER (FLEET)</text>
<line x1="375" y1="70" x2="375" y2="520" stroke="#1B4570" stroke-width="1" stroke-dasharray="5 6"/>
<line x1="828" y1="70" x2="828" y2="520" stroke="#1B4570" stroke-width="1" stroke-dasharray="5 6"/>
<rect x="60" y="80" width="260" height="62" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="190.0" y="107.0" text-anchor="middle" fill="#E4F0EE" font-size="17" font-weight="700">Vehicle data bus (CAN)</text>
<text x="190.0" y="131.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">raw frames, hundreds per second</text>
<rect x="60" y="158" width="260" height="62" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="190.0" y="185.0" text-anchor="middle" fill="#E4F0EE" font-size="19" font-weight="700">Ignition signal</text>
<text x="190.0" y="209.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">running / parked distinction</text>
<rect x="60" y="236" width="260" height="62" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="190.0" y="263.0" text-anchor="middle" fill="#E4F0EE" font-size="19" font-weight="700">Satellites (GNSS)</text>
<text x="190.0" y="287.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">position + second time source</text>
<rect x="60" y="314" width="260" height="62" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="190.0" y="341.0" text-anchor="middle" fill="#E4F0EE" font-size="17" font-weight="700">Nearby WiFi networks</text>
<text x="190.0" y="365.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">indoor position hint</text>
<rect x="60" y="392" width="260" height="62" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="190.0" y="419.0" text-anchor="middle" fill="#E4F0EE" font-size="19" font-weight="700">Cellular network</text>
<text x="190.0" y="443.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">4G modem, SNTP time</text>
<rect x="400" y="72" width="404" height="448" rx="16" fill="none" stroke="#00CAD7" stroke-width="1.6" opacity="0.55"/>
<rect x="424" y="92" width="356" height="66" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="602.0" y="121.0" text-anchor="middle" fill="#E4F0EE" font-size="19" font-weight="700">Collectors</text>
<text x="602.0" y="145.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">CAN table · position (sat/DR) · WiFi list</text>
<rect x="424" y="186" width="356" height="66" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="602.0" y="215.0" text-anchor="middle" fill="#E4F0EE" font-size="19" font-weight="700">Report record (binary)</text>
<text x="602.0" y="239.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">stamp resolved at send time, fleet format</text>
<rect x="424" y="280" width="356" height="66" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="602.0" y="309.0" text-anchor="middle" fill="#E4F0EE" font-size="19" font-weight="700">Persistent buffer (flash)</text>
<text x="602.0" y="333.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">waits out coverage loss, survives power cuts</text>
<rect x="424" y="374" width="356" height="66" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="602.0" y="403.0" text-anchor="middle" fill="#E4F0EE" font-size="19" font-weight="700">MQTT client</text>
<text x="602.0" y="427.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">no record deleted before the ack (PUBACK)</text>
<rect x="424" y="462" width="356" height="44" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="602.0" y="490.0" text-anchor="middle" fill="#E4F0EE" font-size="16" font-weight="700">Command interface</text>
<line x1="602" y1="158" x2="602" y2="186" stroke="#00CAD7" stroke-width="2.4" marker-end="url(#arT)"/>
<line x1="602" y1="252" x2="602" y2="280" stroke="#00CAD7" stroke-width="2.4" marker-end="url(#arT)"/>
<line x1="602" y1="346" x2="602" y2="374" stroke="#00CAD7" stroke-width="2.4" marker-end="url(#arT)"/>
<line x1="320" y1="111" x2="424" y2="125" stroke="#93AEC7" stroke-width="2.4" marker-end="url(#ar)"/>
<line x1="320" y1="189" x2="424" y2="125" stroke="#93AEC7" stroke-width="2.4" marker-end="url(#ar)"/>
<line x1="320" y1="267" x2="424" y2="125" stroke="#93AEC7" stroke-width="2.4" marker-end="url(#ar)"/>
<line x1="320" y1="345" x2="424" y2="125" stroke="#93AEC7" stroke-width="2.4" marker-end="url(#ar)"/>
<line x1="320" y1="423" x2="424" y2="407" stroke="#93AEC7" stroke-width="2.4" marker-end="url(#ar)"/>
<rect x="880" y="92" width="280" height="66" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="1020.0" y="131.0" text-anchor="middle" fill="#E4F0EE" font-size="17" font-weight="700">Message server (broker)</text>
<rect x="880" y="200" width="280" height="80" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="1020.0" y="236.0" text-anchor="middle" fill="#E4F0EE" font-size="19" font-weight="700">Decoding layer</text>
<text x="1020.0" y="260.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">CAN (DBC) · WiFi resolving · dedup</text>
<rect x="880" y="322" width="280" height="66" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="1020.0" y="351.0" text-anchor="middle" fill="#E4F0EE" font-size="19" font-weight="700">Database</text>
<text x="1020.0" y="375.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">report history per vehicle</text>
<rect x="880" y="430" width="280" height="66" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="1020.0" y="459.0" text-anchor="middle" fill="#E4F0EE" font-size="19" font-weight="700">Fleet screen</text>
<text x="1020.0" y="483.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">map, alarms, reports</text>
<line x1="780" y1="407" x2="880" y2="140" stroke="#00CAD7" stroke-width="2.4" marker-end="url(#arT)"/>
<line x1="1020" y1="158" x2="1020" y2="200" stroke="#93AEC7" stroke-width="2.4" marker-end="url(#ar)"/>
<line x1="1020" y1="280" x2="1020" y2="322" stroke="#93AEC7" stroke-width="2.4" marker-end="url(#ar)"/>
<line x1="1020" y1="388" x2="1020" y2="430" stroke="#93AEC7" stroke-width="2.4" marker-end="url(#ar)"/>
<text x="600" y="543" text-anchor="middle" fill="#93AEC7" font-size="14.5" font-weight="600">The device collects and forwards; decoding (CAN signals, WiFi position) happens on the server.</text>
</svg>