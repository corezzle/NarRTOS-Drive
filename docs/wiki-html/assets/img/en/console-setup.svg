<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 595" font-family="-apple-system,'Segoe UI',Roboto,sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93AEC7"/></marker></defs>
<rect width="1200" height="595" fill="#040B1C"/>
<rect x="40" y="24" width="1120" height="531" rx="16" fill="#02060F" stroke="#1B4570" stroke-width="1.6"/>
<circle cx="74" cy="56" r="7.5" fill="#FF6E6E" opacity="0.85"/>
<circle cx="100" cy="56" r="7.5" fill="#F5A623" opacity="0.85"/>
<circle cx="126" cy="56" r="7.5" fill="#2ECC71" opacity="0.85"/>
<text x="600.0" y="62" text-anchor="middle" fill="#93AEC7" font-size="14.5" font-weight="700">USB serial console · initial setup (device output is in Turkish)</text>
<text x="76" y="104" text-anchor="start" fill="#00CAD7" font-size="15.5" font-weight="700" font-family="Menlo,Consolas,monospace">&gt; </text>
<text x="100" y="104" text-anchor="start" fill="#00CAD7" font-size="15.5" font-weight="700" font-family="Menlo,Consolas,monospace">set imei 351234567890123</text>
<text x="76" y="131" text-anchor="start" fill="#E4F0EE" font-size="15" font-weight="500" font-family="Menlo,Consolas,monospace">[cmd] OK: imei=351234567890123</text>
<text x="76" y="158" text-anchor="start" fill="#00CAD7" font-size="15.5" font-weight="700" font-family="Menlo,Consolas,monospace">&gt; </text>
<text x="100" y="158" text-anchor="start" fill="#00CAD7" font-size="15.5" font-weight="700" font-family="Menlo,Consolas,monospace">set mqtt host broker.ornek.com</text>
<text x="76" y="185" text-anchor="start" fill="#E4F0EE" font-size="15" font-weight="500" font-family="Menlo,Consolas,monospace">[cmd] OK: mqtt host=broker.ornek.com</text>
<text x="76" y="212" text-anchor="start" fill="#00CAD7" font-size="15.5" font-weight="700" font-family="Menlo,Consolas,monospace">&gt; </text>
<text x="100" y="212" text-anchor="start" fill="#00CAD7" font-size="15.5" font-weight="700" font-family="Menlo,Consolas,monospace">set wifi ssid Atolye Agi</text>
<text x="76" y="239" text-anchor="start" fill="#E4F0EE" font-size="15" font-weight="500" font-family="Menlo,Consolas,monospace">[cmd] OK: wifi ssid=Atolye Agi</text>
<text x="76" y="266" text-anchor="start" fill="#00CAD7" font-size="15.5" font-weight="700" font-family="Menlo,Consolas,monospace">&gt; </text>
<text x="100" y="266" text-anchor="start" fill="#00CAD7" font-size="15.5" font-weight="700" font-family="Menlo,Consolas,monospace">get config</text>
<text x="76" y="293" text-anchor="start" fill="#93AEC7" font-size="15" font-weight="500" font-family="Menlo,Consolas,monospace">[cmd] imei      = 351234567890123</text>
<text x="76" y="320" text-anchor="start" fill="#93AEC7" font-size="15" font-weight="500" font-family="Menlo,Consolas,monospace">[cmd] mqtt host = broker.ornek.com</text>
<text x="76" y="347" text-anchor="start" fill="#93AEC7" font-size="15" font-weight="500" font-family="Menlo,Consolas,monospace">[cmd] mqtt port = 1883</text>
<text x="76" y="374" text-anchor="start" fill="#93AEC7" font-size="15" font-weight="500" font-family="Menlo,Consolas,monospace">[cmd] mqtt user = &lt;ayarlanmadı&gt;</text>
<text x="76" y="401" text-anchor="start" fill="#93AEC7" font-size="15" font-weight="500" font-family="Menlo,Consolas,monospace">[cmd] apn       = &lt;ayarlanmadı&gt;</text>
<text x="76" y="428" text-anchor="start" fill="#93AEC7" font-size="15" font-weight="500" font-family="Menlo,Consolas,monospace">[cmd] wifi ssid = Atolye Agi</text>
<text x="76" y="455" text-anchor="start" fill="#93AEC7" font-size="15" font-weight="500" font-family="Menlo,Consolas,monospace">[cmd] net back. = &lt;oto&gt; (etkin: wifi)</text>
<text x="76" y="482" text-anchor="start" fill="#93AEC7" font-size="15" font-weight="500" font-family="Menlo,Consolas,monospace">[cmd] pwr sleep = 0 (hep uyanık)</text>
<text x="76" y="509" text-anchor="start" fill="#00CAD7" font-size="15.5" font-weight="700" font-family="Menlo,Consolas,monospace">&gt; </text>
<text x="100" y="509" text-anchor="start" fill="#00CAD7" font-size="15.5" font-weight="700" font-family="Menlo,Consolas,monospace">telemetry now</text>
<text x="76" y="536" text-anchor="start" fill="#E4F0EE" font-size="15" font-weight="500" font-family="Menlo,Consolas,monospace">[cmd] OK: rapor üretildi (14 frame), tampona yazıldı</text>
</svg>