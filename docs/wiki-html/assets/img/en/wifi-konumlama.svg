<text x="605.0" y="439.0" text-anchor="middle" fill="#E4F0EE" font-size="19" font-weight="700"> </text>
<text x="80" y="428" text-anchor="start" fill="#E4F0EE" font-size="15.5" font-weight="800">The device does NOT resolve the position, it forwards the list.</text>
<text x="80" y="452" text-anchor="start" fill="#93AEC7" font-size="14" font-weight="500">Resolution happens on the server; the internet is needed there, not on the device. A report arriving days later still resolves retroactively.</text>
