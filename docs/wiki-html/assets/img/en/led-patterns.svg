<rect x="330" y="430" width="560" height="30" rx="7" fill="#0A2447" stroke="#1B4570" stroke-width="1"/>
<text x="915" y="451" text-anchor="start" fill="#93AEC7" font-size="13.5" font-weight="500">no power, fault, or deep sleep</text>
<text x="600" y="545" text-anchor="middle" fill="#93AEC7" font-size="14" font-weight="600">Rule: the more light, the worse. A healthy device gives one barely visible blink every 3 seconds.</text>
