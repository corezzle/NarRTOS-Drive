<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system,'Segoe UI',Roboto,sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93AEC7"/></marker><marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00CAD7"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF6E6E"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F5A623"/></marker></defs>
<rect width="1200" height="560" fill="#040B1C"/>
<text x="140" y="60" text-anchor="middle" fill="#00CAD7" font-size="16" font-weight="800">VEHICLE SIDE</text>
<text x="880" y="60" text-anchor="middle" fill="#00CAD7" font-size="16" font-weight="800">DEVICE</text>
<rect x="80" y="90" width="280" height="66" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="220.0" y="119.0" text-anchor="middle" fill="#E4F0EE" font-size="19" font-weight="700">Battery</text>
<text x="220.0" y="143.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">12 / 24 V constant supply</text>
<rect x="80" y="180" width="280" height="66" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="220.0" y="209.0" text-anchor="middle" fill="#E4F0EE" font-size="19" font-weight="700">Ignition line</text>
<text x="220.0" y="233.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">live when the key turns</text>
<rect x="80" y="270" width="280" height="66" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="220.0" y="299.0" text-anchor="middle" fill="#E4F0EE" font-size="19" font-weight="700">CAN bus</text>
<text x="220.0" y="323.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">CAN-H and CAN-L, twisted pair</text>
<rect x="80" y="360" width="280" height="66" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="220.0" y="389.0" text-anchor="middle" fill="#E4F0EE" font-size="19" font-weight="700">Sky / network</text>
<text x="220.0" y="413.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">satellite and 4G antenna view</text>
<rect x="700" y="90" width="420" height="380" rx="18" fill="#0A2447" stroke="#00CAD7" stroke-width="1.8" opacity="0.95"/>
<text x="910" y="126" text-anchor="middle" fill="#E4F0EE" font-size="19" font-weight="800">NarRTOS-Drive</text>
<rect x="730" y="150" width="360" height="56" rx="12" fill="#0F2F58" stroke="#1B4570" stroke-width="1.6"/>
<text x="910.0" y="174.0" text-anchor="middle" fill="#E4F0EE" font-size="18" font-weight="700">Power input</text>
<text x="910.0" y="198.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">steps vehicle voltage down to 3.3 V</text>
<rect x="730" y="222" width="360" height="56" rx="12" fill="#0F2F58" stroke="#1B4570" stroke-width="1.6"/>
<text x="910.0" y="246.0" text-anchor="middle" fill="#E4F0EE" font-size="18" font-weight="700">Ignition sense (GPIO 10)</text>
<text x="910.0" y="270.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">read through a voltage divider</text>
<rect x="730" y="294" width="360" height="56" rx="12" fill="#0F2F58" stroke="#1B4570" stroke-width="1.6"/>
<text x="910.0" y="318.0" text-anchor="middle" fill="#E4F0EE" font-size="18" font-weight="700">CAN receiver (transceiver)</text>
<text x="910.0" y="342.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">only LISTENS, never writes</text>
<rect x="730" y="366" width="360" height="84" rx="12" fill="#0F2F58" stroke="#1B4570" stroke-width="1.6"/>
<text x="910.0" y="404.0" text-anchor="middle" fill="#E4F0EE" font-size="18" font-weight="700">Antennas</text>
<text x="910.0" y="428.0" text-anchor="middle" fill="#93AEC7" font-size="14.5">GNSS + 4G; gyroscope on the board</text>
<line x1="360" y1="123" x2="730" y2="178" stroke="#FF6E6E" stroke-width="2.6"/>
<text x="505" y="128" text-anchor="middle" fill="#FF6E6E" font-size="13.5" font-weight="600">+ supply (fused)</text>
<line x1="360" y1="213" x2="730" y2="250" stroke="#F5A623" stroke-width="2.6"/>
<text x="505" y="218" text-anchor="middle" fill="#F5A623" font-size="13.5" font-weight="600">ignition signal</text>
<line x1="360" y1="298" x2="730" y2="318" stroke="#00CAD7" stroke-width="2.6"/>
<line x1="360" y1="308" x2="730" y2="330" stroke="#00CAD7" stroke-width="2.6" stroke-dasharray="7 5"/>
<text x="505" y="296" text-anchor="middle" fill="#00CAD7" font-size="13.5" font-weight="600">CAN-H / CAN-L</text>
<line x1="360" y1="393" x2="730" y2="404" stroke="#93AEC7" stroke-width="2.2" stroke-dasharray="3 5"/>
<rect x="60" y="470" width="1090" height="60" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="605.0" y="506.0" text-anchor="middle" fill="#E4F0EE" font-size="19" font-weight="700"> </text>
<text x="80" y="506" text-anchor="start" fill="#F5A623" font-size="14" font-weight="600">The pin map is TEMPORARY: it will be final with Drive's own board. NEVER wire the ignition input directly to 12 V, a divider is mandatory.</text>
</svg>