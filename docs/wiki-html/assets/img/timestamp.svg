<text x="600" y="585" text-anchor="middle" fill="#93AEC7" font-size="14.5" font-weight="600">Kural: yanlış damga hiç damgadan kötüdür. Çözülemeyecek kayıt beklemez, düşer; çözülebilecek kayıt acele etmez, bekler.</text>
