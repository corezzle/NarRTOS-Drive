<line x1="360" y1="308" x2="730" y2="330" stroke="#00CAD7" stroke-width="2.6" stroke-dasharray="7 5"/>
<text x="505" y="296" text-anchor="start" fill="#00CAD7" font-size="13.5" font-weight="600">CAN-H / CAN-L</text>
<line x1="360" y1="393" x2="730" y2="404" stroke="#93AEC7" stroke-width="2.2" stroke-dasharray="3 5"/>
<rect x="60" y="470" width="1090" height="60" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="605.0" y="506.0" text-anchor="middle" fill="#E4F0EE" font-size="18" font-weight="700"> </text>
<text x="80" y="506" text-anchor="start" fill="#F5A623" font-size="14" font-weight="600">Pin haritası GEÇİCİDİR: Drive'ın kendi kartı tasarlanınca kesinleşecek. Kontak girişi doğrudan 12 V'a BAĞLANMAZ, bölücü şarttır.</text>
