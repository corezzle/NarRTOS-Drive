<text x="910.0" y="174.0" text-anchor="middle" fill="#E4F0EE" font-size="18" font-weight="700">Güç girişi</text>
<text x="910.0" y="197.0" text-anchor="middle" fill="#93AEC7" font-size="13.5" font-weight="500">araç geriliminden 3,3 V'a düşürücü</text>
<rect x="730" y="222" width="360" height="56" rx="12" fill="#0F2F58" stroke="#1B4570" stroke-width="1.6"/>
<text x="910.0" y="246.0" text-anchor="middle" fill="#E4F0EE" font-size="18" font-weight="700">Kontak algısı (GPIO 10)</text>
<text x="910.0" y="269.0" text-anchor="middle" fill="#93AEC7" font-size="13.5" font-weight="500">gerilim bölücü üzerinden okunur</text>
