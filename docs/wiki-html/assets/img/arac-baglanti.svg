<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system,'Segoe UI',Roboto,sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93AEC7"/></marker></defs>
<rect width="1200" height="560" fill="#040B1C"/>
<text x="140" y="60" text-anchor="start" fill="#00CAD7" font-size="16" font-weight="800">ARAÇ TARAFI</text>
<text x="880" y="60" text-anchor="start" fill="#00CAD7" font-size="16" font-weight="800">CİHAZ</text>
<rect x="80" y="90" width="280" height="66" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="220.0" y="119.0" text-anchor="middle" fill="#E4F0EE" font-size="18" font-weight="700">Akü</text>
<text x="220.0" y="142.0" text-anchor="middle" fill="#93AEC7" font-size="13.5" font-weight="500">12 / 24 V sürekli besleme</text>
<rect x="80" y="180" width="280" height="66" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="220.0" y="209.0" text-anchor="middle" fill="#E4F0EE" font-size="18" font-weight="700">Kontak hattı</text>
<text x="220.0" y="232.0" text-anchor="middle" fill="#93AEC7" font-size="13.5" font-weight="500">anahtar açılınca gerilim gelir</text>
<rect x="80" y="270" width="280" height="66" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="220.0" y="299.0" text-anchor="middle" fill="#E4F0EE" font-size="18" font-weight="700">CAN veri yolu</text>
<text x="220.0" y="322.0" text-anchor="middle" fill="#93AEC7" font-size="13.5" font-weight="500">CAN-H ve CAN-L, bükümlü çift</text>
<rect x="80" y="360" width="280" height="66" rx="12" fill="#0A2447" stroke="#1B4570" stroke-width="1.6"/>
<text x="220.0" y="389.0" text-anchor="middle" fill="#E4F0EE" font-size="18" font-weight="700">Gökyüzü / şebeke</text>
<text x="220.0" y="412.0" text-anchor="middle" fill="#93AEC7" font-size="13.5" font-weight="500">uydu ve 4G anten görüşü</text>
